
name: Python Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Репозиторийді жүктеу
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python орнату
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Pip жаңарту және кітапханаларды орнату
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Pytest орнату (егер requirements ішінде жоқ болса)
      - name: Install pytest
        run: pip install pytest

      # 5. Тесттерді іске қосу
      - name: Run tests
        run: python -m pytest tests/ -v
